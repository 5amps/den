# Potato Bot configuration.
# Lines starting with # are comments. Restart the bot (or use /restart) after editing.
# The bot token is NOT stored here. It goes in the .env file.

[bot]
# Text shown under the bot's name ("Playing ..."). Empty string = nothing.
status = "running locally"

# Your own server's ID. When set, slash commands appear in that server instantly.
# When 0, commands are registered for every server, which can take up to an hour to show.
# How to get it: Discord Settings > Advanced > Developer Mode on, then right-click
# your server icon > Copy Server ID.
dev_guild_id = 634369769583149090

# How many recent messages to keep in memory (used for delete/edit logs).
# Lower = less RAM. 0 = keep none.
message_cache = 500

# Where the database, logs, cache and transcripts are stored (relative to this folder).
data_dir = "data"

# DEBUG, INFO, WARNING or ERROR.
log_level = "INFO"

# Extra Discord gateway intents, only if a module you wrote yourself needs them.
extra_intents = []

[modules]
# true = load the module. false = the file is never imported, so it costs zero RAM.
# Modules marked "not built yet" are added in later phases; leave them false until then.
music      = true    # local music library, queue, playlists, optional YouTube
video      = false   # not built yet
antiraid   = false   # not built yet
antispam   = false   # not built yet
tickets    = false   # not built yet
rsvp       = false   # not built yet
moderation = false   # not built yet
utility    = false   # not built yet

[music]
# Folders that hold your music. Sub-folders are included. Use forward slashes.
# Example: library_dirs = ["C:/Users/you/Music", "D:/Songs"]
library_dirs = []

# File types treated as music. Video files listed here are played as audio only.
extensions = [".mp3", ".flac", ".ogg", ".opus", ".m4a", ".wav", ".aac", ".wma", ".mp4"]

# Look for new/removed files every time the bot starts. Turn off for huge libraries on
# slow disks and use /rescan_library by hand instead.
scan_on_start = true

# Volume for a server that never set one. 100 lets Opus files pass through untouched.
default_volume = 100

# Audio quality for files that must be converted (mp3, flac, ...). 64 = lighter, 128 = best.
bitrate_kbps = 96

# Opus encoder effort, 0-10. Lower = less CPU, slightly lower quality. 5 suits a weak CPU.
opus_complexity = 5

# Send Opus files straight to Discord without re-encoding (lowest CPU). Leave on.
passthrough = true

max_queue = 500

# Leave the voice channel after this many minutes with nothing playing or nobody listening.
# 0 = stay forever.
idle_disconnect_minutes = 5

# After a restart or crash, continue the queue if people are still in the voice channel.
resume_on_start = true

# Post "Now playing" in the text channel on every track change.
announce_tracks = false

# --- YouTube (optional, off by default) ---
# Downloading from YouTube is against YouTube's Terms of Service. Keep it for personal use
# in a private server. It needs yt-dlp installed and breaks whenever YouTube changes
# something, until yt-dlp is updated (pip install -U yt-dlp).
youtube = false
cache_dir = "data/cache"      # downloaded audio is kept here and reused
cache_max_mb = 1024           # oldest unused files are deleted above this size
max_track_minutes = 180
ytdlp_args = []               # extra yt-dlp options, e.g. ["--js-runtimes", "node"]
