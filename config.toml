# Potato Bot configuration.
# Lines starting with # are comments. Restart the bot (or use /restart) after editing.
# The bot token is NOT stored here. It goes in the .env file.

[bot]
# Text shown under the bot's name ("Playing ..."). Empty string = nothing.
status = "running locally"

# Your own server's ID. When set, slash commands appear in that server instantly.
# When 0, commands are registered for every server, which can take up to an hour to show.
# How to get it: Discord Settings > Advanced > Developer Mode on, then right-click
# your server icon > Copy Server ID.
dev_guild_id = 634369769583149090

# How many recent messages to keep in memory (used for delete/edit logs).
# Lower = less RAM. 0 = keep none.
message_cache = 500

# Where the database, logs, cache and transcripts are stored (relative to this folder).
data_dir = "data"

# DEBUG, INFO, WARNING or ERROR.
log_level = "INFO"

# Extra Discord gateway intents, only if a module you wrote yourself needs them.
extra_intents = []

[modules]
# true = load the module. false = the file is never imported, so it costs zero RAM.
# antiraid, antispam, tickets and utility need "Server Members Intent" and/or
# "Message Content Intent" switched on in the Discord Developer Portal (Bot page).
music      = true    # local music library, queue, playlists, optional YouTube
video      = true    # audio from local video files, short clips (needs music)
antiraid   = true    # join-rate detection, lockdown, verification button
antispam   = true    # message rate, duplicates, mentions, invites, escalation
tickets    = true    # ticket panel, private channels, transcripts
rsvp       = true    # events with Going / Maybe / No buttons and reminders
moderation = true    # warn, timeout, kick, ban, purge, history
utility    = true    # welcome/leave, auto-role, reaction roles, message logs, /help

[music]
# Folders that hold your music. Sub-folders are included. Use forward slashes.
# Example: library_dirs = ["C:/Users/you/Music", "D:/Songs"]
library_dirs = []

# File types treated as music. Video files listed here are played as audio only.
extensions = [".mp3", ".flac", ".ogg", ".opus", ".m4a", ".wav", ".aac", ".wma", ".mp4"]

# Look for new/removed files every time the bot starts. Turn off for huge libraries on
# slow disks and use /rescan_library by hand instead.
scan_on_start = true

# Volume for a server that never set one. 100 lets Opus files pass through untouched.
default_volume = 100

# Audio quality for files that must be converted (mp3, flac, ...). 64 = lighter, 128 = best.
bitrate_kbps = 96

# Opus encoder effort, 0-10. Lower = less CPU, slightly lower quality. 5 suits a weak CPU.
opus_complexity = 5

# Send Opus files straight to Discord without re-encoding (lowest CPU). Leave on.
passthrough = true

max_queue = 500

# Leave the voice channel after this many minutes with nothing playing or nobody listening.
# 0 = stay forever.
idle_disconnect_minutes = 5

# After a restart or crash, continue the queue if people are still in the voice channel.
resume_on_start = true

# Post "Now playing" in the text channel on every track change.
announce_tracks = false

# --- YouTube (optional, off by default) ---
# Downloading from YouTube is against YouTube's Terms of Service. Keep it for personal use
# in a private server. It needs yt-dlp installed and breaks whenever YouTube changes
# something, until yt-dlp is updated (pip install -U yt-dlp).
youtube = false
cache_dir = "data/cache"      # downloaded audio is kept here and reused
cache_max_mb = 1024           # oldest unused files are deleted above this size
max_track_minutes = 180
ytdlp_args = []               # extra yt-dlp options, e.g. ["--js-runtimes", "node"]

[video]
# Folders with video files. /video play uses their audio; /video clip posts a short piece.
# Bots cannot stream video into a voice channel; Discord does not offer that to bots.
library_dirs = []
extensions = [".mp4", ".mkv", ".webm", ".avi", ".mov", ".m4v"]
clip_max_seconds = 60         # making a clip uses a full CPU core while it runs
clip_height = 480
clip_timeout_seconds = 300

[antispam]
message_limit = 6             # more than this many messages ...
message_window = 8            # ... within this many seconds = spam
duplicate_limit = 4           # the same text this many times ...
duplicate_window = 30         # ... within this many seconds
mention_limit = 6             # user/role mentions in one message
emoji_limit = 15              # emoji in one message
caps_percent = 80             # percent capital letters ...
caps_min_length = 20          # ... in messages at least this long
block_invites = true          # Discord invite links
block_links = false           # every link except allowed_domains
allowed_domains = ["youtube.com", "youtu.be", "tenor.com", "giphy.com"]
delete_messages = true
# What happens on strike 1, 2, 3 ... (the last entry repeats). warn, timeout, kick or ban.
escalation = ["warn", "timeout", "timeout", "kick", "ban"]
timeout_minutes = 10
strike_decay_minutes = 60     # strikes are forgotten after this long without spam
# Members with Manage Messages are never filtered. Add more exceptions in Discord with
# /antispam ignore-role and /antispam ignore-channel.

[antiraid]
join_limit = 8                # this many joins ...
join_window = 10              # ... within this many seconds starts a lockdown
lockdown_minutes = 10         # automatic unlock; 0 = stay locked until /unlock
raid_action = "kick"          # for accounts joining during lockdown: kick, timeout or none
min_account_age_hours = 0     # 0 = off. Accounts younger than this are handled on join
age_action = "kick"           # kick, timeout or flag (log only)
new_member_minutes = 10       # members this new who post an invite or mass-mention ...
new_member_mention_limit = 4
new_member_action = "ban"     # ... get this: ban, kick, timeout or none
timeout_minutes = 60

[tickets]
max_open_per_user = 1
opener_can_close = true
transcript_format = "html"    # html, text or both. Saved in data/transcripts/
transcript_max_messages = 2000
dm_transcript = true          # send the transcript to the person who opened the ticket
delete_delay_seconds = 5

[rsvp]
anyone_can_create = false     # false = only staff can create events
close_minutes_after_start = 0 # keep the buttons open this long after the start time
refresh_seconds = 2           # the event message is edited at most this often

[utility]
log_deleted_messages = true   # needs /config log-channel
log_edited_messages = true
