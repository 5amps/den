# Lite mode: for a phone (Termux) or a very weak machine.
# Voice features are off, so ffmpeg, yt-dlp and the voice libraries are not needed.
# Start with:   ./start.sh --config config.lite.toml
# Every setting not listed here uses the same default as config.toml.

[bot]
status = "lite mode"
dev_guild_id = 0              # put your server ID here so commands appear instantly
message_cache = 100           # smaller cache = less RAM; delete logs cover fewer messages
data_dir = "data"
log_level = "WARNING"

[modules]
music      = false            # heavy: ffmpeg + voice connection
video      = false            # heavy: video encoding
antiraid   = true
antispam   = true
tickets    = true
rsvp       = true
moderation = true
utility    = true

[antispam]
block_invites = true
escalation = ["warn", "timeout", "timeout", "kick", "ban"]

[antiraid]
join_limit = 8
join_window = 10
lockdown_minutes = 10

[tickets]
transcript_format = "text"    # smaller files than html
transcript_max_messages = 1000
